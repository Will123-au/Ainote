# Ainote backend - LAN + Tailscale deployment
#
# Basic (LAN, and Tailscale if the laptop itself runs Tailscale):
#   docker compose up -d --build
#
# With built-in Tailscale container (gives HTTPS: https://ainote.<tailnet>.ts.net):
#   docker compose --profile tailscale up -d --build

services:
  ainote:
    build:
      context: ..
      dockerfile: Dockerfile.optimized
    image: ainote-backend:local
    container_name: ainote
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    ports:
      # 0.0.0.0 = listen on all network cards (LAN + Tailscale on the host)
      - "0.0.0.0:${HOST_PORT:-3000}:3000"
    extra_hosts:
      # lets the container reach Ollama / LM Studio running on the laptop
      - "host.docker.internal:host-gateway"
    healthcheck:
      # SOLO_API_KEY protects /api/*, so the health check must send it too
      test: ["CMD-SHELL", "wget -q -O /dev/null --header=\"Authorization: Bearer $${SOLO_API_KEY}\" http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # Optional: own Tailscale node with HTTPS (needs TS_AUTHKEY in .env)
  tailscale:
    profiles: ["tailscale"]
    image: tailscale/tailscale:latest
    container_name: ainote-tailscale
    hostname: ${TS_HOSTNAME:-ainote}
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME:-ainote}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on:
      - ainote

volumes:
  tailscale-state:
